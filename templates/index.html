<!DOCTYPE html>
<html>
<head>
    <title>Video Popup</title>
    <style>
        #videoPopup {
            display: block;  /* Display the popup immediately */
            position: fixed;
            top: 10%;
            left: 25%;
            width: 50%;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px gray;
            z-index: 1000;
        }
        #overlay {
            display: block;  /* Overlay will also be visible immediately */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="overlay" onclick="hideVideo()"></div>

    <div id="videoPopup">
        <video width="100%" controls autoplay>
            <source src="{{ url_for('static', filename='videos/' + video_file) }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        // This ensures the popup and overlay show automatically when the page is loaded
        window.onload = function() {
            document.getElementById('videoPopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        };

        // This hides the popup when the overlay is clicked
        function hideVideo() {
            document.getElementById('videoPopup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
